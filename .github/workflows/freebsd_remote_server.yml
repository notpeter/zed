name: freebsd_remote_server

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  CARGO_INCREMENTAL: '0'

on:
  workflow_dispatch: {}
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  build:
    name: build remote_server on freebsd
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Restore freebsd Cargo cache
        id: restore-cargo-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .cargo-cache-vm
            .rustup-cache-vm
          key: remote-server-freebsd-cargo-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            remote-server-freebsd-cargo-${{ hashFiles('Cargo.lock') }}-
            remote-server-freebsd-cargo-

      - name: Build remote_server on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.3'
          usesh: true
          mem: 8192
          copyback: true
          prepare: |
            set -eu
            export CARGO_HOME="$GITHUB_WORKSPACE/.cargo-cache-vm"
            export RUSTUP_HOME="$GITHUB_WORKSPACE/.rustup-cache-vm"
            pkg install -y curl cmake pkgconf protobuf
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          run: |
            set -eu
            export CARGO_HOME="$GITHUB_WORKSPACE/.cargo-cache-vm"
            export RUSTUP_HOME="$GITHUB_WORKSPACE/.rustup-cache-vm"
            . "$CARGO_HOME/env"
            export PROTOC="/usr/local/bin/protoc"
            export CARGO_BUILD_JOBS=2
            export CARGO_PROFILE_RELEASE_DEBUG=0
            export CARGO_PROFILE_RELEASE_LTO=false
            export CARGO_PROFILE_RELEASE_OPT_LEVEL=2
            export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
            rustc --version --verbose
            cargo build --release --locked -p remote_server \
                --target "x86_64-unknown-freebsd" \
                --target-dir /var/tmp/zed-target
            /var/tmp/zed-target/x86_64-unknown-freebsd/release/remote-server version
            mkdir -p artifacts
            gzip -c /var/tmp/zed-target/x86_64-unknown-freebsd/release/remote-server \
                > artifacts/zed-remote-server-freebsd-x86_64.gz

      - name: Upload freebsd remote_server
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zed-remote-server-freebsd-x86_64.gz
          path: artifacts/zed-remote-server-freebsd-x86_64.gz
          if-no-files-found: error

      - name: Save freebsd Cargo cache
        uses: actions/cache/save@v5
        with:
          path: |
            .cargo-cache-vm
            .rustup-cache-vm
          key: ${{ steps.restore-cargo-cache.outputs.cache-primary-key }}
